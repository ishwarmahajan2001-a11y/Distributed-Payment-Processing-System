# Service Configuration
# ---------------------
server.port=8082
spring.application.name=payment-processing-service


# Database (MySQL) Connection
# ---------------------------

spring.datasource.url=jdbc:mysql://localhost:3306/payment_processing_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA / Hibernate Settings
# ------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Messaging (ActiveMQ) Connection
# -------------------------------
spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=admin
spring.activemq.password=admin
# Configure JMS to use queues by default (point-to-point messaging)
spring.jms.pub-sub-domain=false


# Downstream Service Configuration
# --------------------------------
# The URL for the trustly-provider-service.
# For local deployment, this points to localhost. For cloud, it would be the server's IP.
trustly.provider.url=http://localhost:8083