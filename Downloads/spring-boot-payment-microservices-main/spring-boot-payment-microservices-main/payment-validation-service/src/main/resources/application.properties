# Server Port for the Payment Validation Service
server.port=8081
spring.application.name=payment-validation-service

# Database Connection for the Payment Validation Service
spring.datasource.url=jdbc:mysql://localhost:3306/payment_validation_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Custom Validation Logic Configuration
payment.validation.threshold.hours=1
payment.validation.threshold.attempts=5

# Shared secret for HMAC client authentication
client.hmac.secret=my-super-secret-key-for-elos

# --- DEPLOYMENT CONFIGURATION ---
# The address for the downstream payment-processing-service.
# For local dev, this is localhost. For EC2, we'll change it to the public IP.
payment.processing.url=http://localhost:8082